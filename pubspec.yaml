name: pocket_brain
description: >-
  Pocket Brain is a private, on-device AI memory companion. Save notes and
  links, organise them with Gemma running locally, and ask questions answered
  only from what you saved.
repository: https://github.com/jihanurrahman33/Pocket-Brain-App
issue_tracker: https://github.com/jihanurrahman33/Pocket-Brain-App/issues
publish_to: 'none' # An app, not a pub.dev package.

version: 0.2.0+2

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_litertlm: ^1.20.0
  go_router: ^18.1.4
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  sqflite_common_ffi: ^2.4.7
  sqflite: ^2.4.6
  shared_preferences: ^2.5.6
  bloc_concurrency: ^0.3.0
  http: ^1.6.0
  stream_transform: ^2.1.2
  get_it: ^9.3.0
  sqflite_common: ^2.5.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
flutter:
  uses-material-design: true
